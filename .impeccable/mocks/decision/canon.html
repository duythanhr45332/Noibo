<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { width: 1440px; height: 900px; overflow: hidden; background: #f8fafc; color: #0f172a; padding: 28px 36px; display: flex; flex-direction: column; gap: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; }
  .table { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px; flex: 1; }
</style>
</head>
<body>
  <div style="font-size:26px;font-weight:700">Dashboard Quản Trị Hợp Đồng Chuẩn B2B SaaS</div>
  <div class="kpis">
    <div class="kpi"><div style="font-size:12px;color:#64748b">Tổng Doanh Thu</div><div style="font-size:28px;font-weight:700;margin-top:6px">2,45 Tỷ</div></div>
    <div class="kpi"><div style="font-size:12px;color:#dc2626">Dự Án Nguy Cơ</div><div style="font-size:28px;font-weight:700;color:#dc2626;margin-top:6px">2 Dự án</div></div>
    <div class="kpi"><div style="font-size:12px;color:#2563eb">Cần Thu Hồi Nợ</div><div style="font-size:28px;font-weight:700;margin-top:6px">485 Triệu</div></div>
    <div class="kpi"><div style="font-size:12px;color:#10b981">Quỹ Thưởng 50/50</div><div style="font-size:28px;font-weight:700;color:#10b981;margin-top:6px">92,5 Triệu</div></div>
  </div>
  <div class="table">
    <div style="font-size:22px;font-weight:600">Danh Sách Hợp Đồng & Tiến Độ</div>
  </div>
</body>
</html>
