version: '3.8'

services:
  # ==========================================
  # Cơ sở dữ liệu nội bộ (Local PostgreSQL - ERP-AM)
  # Chạy ở port 5433 để không xung đột với VPCC (5432)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: erp_am_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_am_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - erp_am_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_am_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  erp_am_pgdata:
